name: pollinations
version: 1.4.4
description: "Pollinations image generation and editing. The picker is read live from the Pollinations catalog, so it follows changes without a plugin update. No key is needed for the free route; a Pollinations key unlocks the rest of the catalog and editing; paid-only models sit behind a toggle that ships off."
author: greythx
kind: backend
license: MIT
homepage: https://github.com/greythx/hermes-pollinations
tags:
  - image-generation
  - pollinations
  - image-editing
requires_hermes: ">=0.21.6"
requires_env:
  - name: POLLINATIONS_API_KEY
    description: "Optional — unlocks the live catalog and image editing; the free classic model works without it"
    url: https://enter.pollinations.ai/keys
    secret: true
config_schema:
  include_paid_models:
    type: bool
    default: false
    label: "Include paid models"
    description: "Also list paid-only Pollinations models in the picker. Requires a Pollinations API key with a paid balance; free and unpaid-credit models are listed either way."
